[package]
name = "atlas"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
axum = { version = "0.8.9", features = ["http2"] }
bcrypt = "0.19.3"
dotenvy = "0.15.7"
hmac = "0.13.0"
hyper = { version = "1.12.0", features = ["http2"] }
hyper-util = { version = "0.1.21", features = ["server", "http2", "tokio", "service"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
