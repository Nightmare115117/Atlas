[package]
name = "atlas"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["http2"] }
dotenvy = "0.15.7"
hyper = { version = "1.12.0", features = ["http2"] }
hyper-util = { version = "0.1.21", features = ["server", "http2", "tokio", "service"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
